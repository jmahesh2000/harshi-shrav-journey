<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harshith & Shravan | Our Journey</title>
<style>
:root{
 --cream:#f6f1e6;--paper:#fffdf8;--ink:#182b43;--muted:#64748b;
 --blue:#2196d3;--purple:#7657d9;--green:#4e9b72;--orange:#ef8b35;
 --line:#e8dfcf;--shadow:0 12px 30px rgba(35,45,60,.10)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{max-width:1250px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:900;font-size:19px}
.logo-mark{font-size:27px}.logo-mark-img{width:48px;height:48px;object-fit:cover;border-radius:9px;display:block;box-shadow:0 2px 7px rgba(0,0,0,.15)}.tagline{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.nav button{border:0;background:transparent;color:var(--ink);font-weight:800;padding:10px 13px;border-radius:12px}
.nav button:hover{background:#edf6fb}.nav .primary{background:#e9f5fb;color:#1479ae}.auth-area{display:flex;align-items:center;gap:8px;margin-left:6px}.auth-user{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.page{max-width:1250px;margin:auto;padding:22px 20px 60px}
.hero{min-height:365px;border-radius:28px;overflow:hidden;position:relative;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:28px 25px;background:
linear-gradient(rgba(205,229,238,.88),rgba(247,241,226,.42)),linear-gradient(180deg,#a9d6ed,#e9e0c9);box-shadow:var(--shadow)}
.hero:before{content:none}
.hero-content{position:relative;z-index:2;max-width:760px}
.hero-kicker{font-size:11px;letter-spacing:2.5px;font-weight:900;color:#315c75}
.hero h1{font-size:clamp(42px,6vw,68px);font-weight:800;margin:2px 0 6px;font-family:"Trebuchet MS",sans-serif;letter-spacing:-2px}
.hero h2{margin:0 0 7px;font-size:19px}.hero p{color:#38546b;font-size:15px;margin:5px 0}
.signs{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0}
.sign{padding:7px 17px;color:white;font-weight:900;transform:rotate(-2deg);box-shadow:0 5px 10px #0002}
.sign:nth-child(1){background:#5a8f78}.sign:nth-child(2){background:#e18a35;transform:rotate(2deg)}
.sign:nth-child(3){background:#4c91ad;transform:rotate(-1deg)}.sign:nth-child(4){background:#d36c5e;transform:rotate(2deg)}
.brothers{position:relative;z-index:3;margin:-70px auto 0;max-width:1120px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bro-card{background:var(--paper);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:185px 1fr;gap:18px;align-items:center}
.photo{width:185px;height:225px;object-fit:cover;object-position:center center;border-radius:14px;display:block}
.bro-card h2{font-size:29px;margin:0 0 2px}.age{font-size:13px;color:var(--muted);font-weight:800}.motto{font-weight:900;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.tag{font-size:12px;font-weight:800;background:#eef3f5;padding:6px 9px;border-radius:999px}
.cta{border:0;border-radius:999px;padding:10px 15px;color:white;font-weight:900;background:var(--blue)}
.shrav .cta{background:var(--purple)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:42px 4px 16px}
.section-title h2{font-size:29px;margin:0}.section-title p{margin:3px 0;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 5px;font-size:22px}.panel ul{padding-left:21px;margin:14px 0 0}.panel li{margin:8px 0}
.label{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--blue)}.shrav .label{color:var(--purple)}
.blog-grid,.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.post,.project{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.post-body,.project-body{padding:17px}.post h3,.project h3{margin:5px 0 7px}.post p,.project p{color:var(--muted);margin:0}.post button{margin-top:14px}
.timeline{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow);overflow-x:auto}
.line{min-width:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;padding-top:30px}
.line:before{content:"";height:3px;background:#b9c7ca;position:absolute;left:5%;right:5%;top:39px}
.milestone{text-align:center;position:relative}.dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:4px solid white;box-shadow:0 0 0 2px #b9c7ca;margin:0 auto 14px;position:relative;z-index:2}
.milestone:nth-child(even) .dot{background:var(--orange)}.milestone strong{font-size:13px}.milestone p{font-size:12px;color:var(--muted);padding:0 6px}.timeline-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.timeline-head h3{margin:0;font-size:20px}.timeline-head p{margin:2px 0;color:var(--muted);font-size:13px}.timeline-avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;border:3px solid white;box-shadow:0 0 0 2px #b9c7ca}.timeline-avatar img{width:100%;height:100%;object-fit:cover}
footer{margin-top:50px;padding:38px 20px;text-align:center;background:#18334b;color:white}
footer p{margin:4px;color:#d8e6ee}.footer-big{font-size:20px;font-weight:900}
@media(max-width:900px){.brothers,.two{grid-template-columns:1fr}.bro-card{grid-template-columns:130px 1fr}.photo{width:130px;height:175px}.blog-grid,.project-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.nav{overflow-x:auto}.logo{min-width:205px}.logo-mark-img{width:42px;height:42px}.nav button{white-space:nowrap}.hero{min-height:340px;padding:24px 18px}.brothers{margin:16px auto 0}.bro-card{grid-template-columns:1fr}.photo{width:100%;height:300px;object-position:center 25%}.blog-grid,.project-grid{grid-template-columns:1fr}.section-title{display:block}.section-title p{margin-top:5px}}
</style>
</head>
<body>
<header><nav class="nav">
<div class="logo"><img class="logo-mark-img" src="images/logo.jpg" alt="Harshith & Shravan"><div>Harshith & Shravan<div class="tagline">LEARN · CREATE · EXPLORE · GROW</div></div></div>
<button id="nav-home" onclick="go('home')">⌂ Home</button>
<button id="nav-harshith" onclick="go('harshith')">👦 Harshith⌄</button>
<button id="nav-shravan" onclick="go('shravan')">👦 Shravan⌄</button>
<button id="nav-projects" onclick="go('projects')">💡 Our Projects</button>
<button id="nav-gallery" onclick="go('gallery')">📸 Gallery</button>
<div id="authArea" class="auth-area"></div>
</nav></header>

<main id="app" class="page"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const H = "images/harshith.jpg";
const S = "images/shravan.jpeg";

const data = {
  harshith: {
    name: "Harshith", nick: "Harshi", age: 9, img: H,
    motto: "Create · Explore · Play",
    interests: ["🎨 Crafts","🎻 Violin","🎾 Tennis","🏓 Pickleball","💡 Entrepreneurship","🎥 YouTube"],
    now: ["Learning violin","Play tennis and pickleball","Design new crafts","Exploring craft ideas to sell","Create new YouTube videos","Learning fractions in math"]
  },
  shravan: {
    name: "Shravan", nick: "Shrav", age: 13, img: S,
    motto: "Build · Learn · Challenge",
    interests: ["♟️ Chess","🎮 Video Games","💻 Coding","🥋 Karate","🏀 Basketball","🎹 Keyboard"],
    now: ["Exploring new music using keyboard","Geometry and PSAT preparation","Improving basketball skills","Exploring science experiments","Continuing coding","Learning computer basics"]
  }
};

const SUPABASE_URL = "https://feuqwyxillidclvxyxoi.supabase.co";
const SUPABASE_KEY = "sb_publishable_I6ZI6sZ7OzMw9qq6tcQ5Lw_43sM0Pcm";

const supabaseClient = window.supabase?.createClient
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

let posts = [];
let profiles = {};
let lastDatabaseError = "";
let currentUser = null;

function isAdmin(){ return !!currentUser; }

async function updateAuthState(){
  if(!supabaseClient){ currentUser=null; renderAuthArea(); return; }
  const {data,error}=await supabaseClient.auth.getUser();
  currentUser=error ? null : (data.user || null);
  renderAuthArea();
}

function esc(value){
  return String(value ?? "").replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

function databaseErrorText(error){
  return error?.message || error?.details || error?.hint || "Unknown database error.";
}

function go(route){
  location.hash = route;
  if(location.hash.slice(1) === route) render();
}

async function showLogin(){
  if(!supabaseClient){ alert("Supabase is not available."); return; }
  const email = prompt("Admin email:");
  if(!email) return;
  const password = prompt("Admin password:");
  if(!password) return;
  const { error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
  if(error) alert("Login failed: " + databaseErrorText(error));
}

async function logout(){
  if(!supabaseClient) return;
  const { error } = await supabaseClient.auth.signOut();
  if(error) alert("Logout failed: " + databaseErrorText(error));
  currentUser = null;
  renderAuthArea();
  go("home");
}

async function loadProfiles(){
  profiles = {};
  if(!supabaseClient) return;
  const { data, error } = await supabaseClient.from("profiles").select("*");
  if(error){ lastDatabaseError = databaseErrorText(error); console.error("Error loading profiles:", error); return; }
  (data || []).forEach(p => {
    const key = String(p.role || "").toLowerCase();
    if(key) profiles[key] = p;
  });
}

async function loadPosts(){
  posts = [];
  if(!supabaseClient) return;
  const { data, error } = await supabaseClient.from("posts").select("*").order("created_at", { ascending:false });
  if(error){ lastDatabaseError = databaseErrorText(error); console.error("Error loading posts:", error); return; }
  posts = data || [];
}

function profileData(key){
  const base = data[key] || {};
  const db = profiles[key] || {};
  return {
    ...base,
    ...db,
    name: db.name || base.name || key,
    age: db.age ?? base.age,
    img: db.image_url || base.img,
    motto: db.tagline || base.motto,
    description: db.description || "",
    interests: Array.isArray(db.interests) ? db.interests : (db.interests ? String(db.interests).split(/\n|,/).map(x=>x.trim()).filter(Boolean) : base.interests || []),
    now: Array.isArray(db.working_on) ? db.working_on : (db.working_on ? String(db.working_on).split(/\n/).map(x=>x.trim()).filter(Boolean) : base.now || [])
  };
}

function tags(items){ return (items || []).map(x => `<span class="tag">${esc(x)}</span>`).join(""); }
function listItems(items){ return (items || []).map(x => `<li>${esc(x)}</li>`).join(""); }
function project(icon,title,desc){ return `<article class="project"><div class="project-body"><div class="label">${esc(icon)} PROJECT</div><h3>${esc(title)}</h3><p>${esc(desc)}</p></div></article>`; }

function postCard(post){
  return `<article class="post"><div class="post-body"><div class="label">${esc(post.author_role || "JOURNEY")}</div><h3>${esc(post.title || "Untitled")}</h3><p>${esc((post.content || "").slice(0,180))}${(post.content || "").length > 180 ? "…" : ""}</p></div></article>`;
}

function home(){
  const h = profileData("harshith"), s = profileData("shravan");
  document.getElementById("app").innerHTML = `
    ${lastDatabaseError ? `<div class="panel" style="color:#b45309;margin-bottom:18px">Database connection issue: ${esc(lastDatabaseError)}</div>` : ""}
    <section class="hero"><div class="hero-content">
      <div class="hero-kicker">TWO BROTHERS · TWO PERSONALITIES · ONE AMAZING STORY</div>
      <h1>Our Journey</h1>
      <h2>A place where we share what we learn, create, play and achieve.</h2>
      <p>Follow our journey as we explore, experiment and grow together!</p>
      <div class="signs"><span class="sign">EXPLORE</span><span class="sign">LEARN</span><span class="sign">CREATE</span><span class="sign">GROW</span></div>
    </div></section>
    <section class="brothers">
      <article class="bro-card"><img class="photo" src="${esc(h.img || H)}" alt="${esc(h.name)}"><div><div class="age">${esc(h.age)} YEARS OLD</div><h2>${esc(h.name)}</h2><div class="motto">${esc(h.motto)}</div><div class="tags">${tags(h.interests)}</div><button class="cta" onclick="go('harshith')">Explore ${esc(h.name)}'s Space</button></div></article>
      <article class="bro-card shrav"><img class="photo" src="${esc(s.img || S)}" alt="${esc(s.name)}"><div><div class="age">${esc(s.age)} YEARS OLD</div><h2>${esc(s.name)}</h2><div class="motto">${esc(s.motto)}</div><div class="tags">${tags(s.interests)}</div><button class="cta" onclick="go('shravan')">Explore ${esc(s.name)}'s Space</button></div></article>
    </section>`;
}

function person(key){
  const p = profileData(key);
  const rolePosts = posts.filter(post => String(post.author_role || post.role || "").toLowerCase() === key || String(post.author || "").toLowerCase() === key);
  document.getElementById("app").innerHTML = `
    <div class="section-title"><div><h2>${key === "harshith" ? "🎨" : "🚀"} ${esc(p.name)}'s Space</h2><p>${esc(p.age)} years old · ${esc(p.motto)}</p></div>${isAdmin() ? `<button class="cta" onclick="newPost('${key}')">＋ New Blog Post</button>` : ""}</div>
    <div class="two"><div class="panel"><img src="${esc(p.img || (key === "harshith" ? H : S))}" style="width:100%;height:430px;object-fit:cover;border-radius:15px"><h3>${esc(p.name)}</h3><p>${esc(p.description || p.motto || "")}</p></div><div class="panel"><div class="label">MY INTERESTS</div><div class="tags">${tags(p.interests)}</div><h3 style="margin-top:28px">🚀 What I'm Working On</h3><ul>${listItems(p.now)}</ul></div></div>
    <div class="section-title"><div><h2>📝 Latest Posts</h2><p>Stories, projects and things I'm learning.</p></div></div>
    <div class="blog-grid">${rolePosts.length ? rolePosts.map(postCard).join("") : `<div class="panel"><p>No posts yet.</p></div>`}</div>`;
}

function newPost(key){
  if(!isAdmin()){ alert("Admin access required."); return; }
  const p = profileData(key);
  document.getElementById("app").innerHTML = `<div class="panel"><h2>✍️ New Post for ${esc(p.name)}</h2><p>Share an experience, something you learned, a project, or something you like.</p><label>Title</label><input id="postTitle" style="width:100%;padding:12px;margin:8px 0 16px" placeholder="Post title"><label>Write your post</label><textarea id="postContent" style="width:100%;min-height:240px;padding:12px;margin:8px 0 16px"></textarea><div id="postMessage" style="margin-bottom:12px"></div><button class="cta" onclick="publishPost('${key}')">Publish Post</button> <button onclick="person('${key}')">Cancel</button></div>`;
}

async function publishPost(key){
  if(!isAdmin()) return;
  const title = document.getElementById("postTitle").value.trim();
  const content = document.getElementById("postContent").value.trim();
  const message = document.getElementById("postMessage");
  if(!title || !content){ message.style.color="#c0392b"; message.textContent="Title and post content are required."; return; }
  const profileRow = profiles[key];
  if(!profileRow){ message.style.color="#c0392b"; message.textContent="Profile not found."; return; }
  try{
    const { error } = await supabaseClient.from("posts").insert({ author_id: profileRow.id, title, content, status:"published" });
    if(error) throw error;
    message.style.color="#2e8b57"; message.textContent="Post published successfully!";
    await loadPosts();
    setTimeout(()=>person(key),500);
  }catch(error){ message.style.color="#c0392b"; message.textContent="Could not publish: " + databaseErrorText(error); console.error(error); }
}

async function managePosts(){
  if(!isAdmin()){ alert("Admin access required."); return; }
  await loadPosts();
  const html = `<div class="section-title"><div><h2>📝 Manage Posts</h2><p>${posts.length} post(s) found.</p></div><button onclick="adminDashboard()">← Back to Dashboard</button></div><div class="project-grid">${posts.length ? posts.map(post => `<div class="panel"><h3>${esc(post.title || "Untitled")}</h3><p>${esc((post.content || "").slice(0,220))}</p><p style="margin-top:12px"><button onclick="editPost('${post.id}')">✏️ Edit</button> <button onclick="deletePost('${post.id}')">🗑️ Delete</button></p></div>`).join("") : `<div class="panel"><p>No posts found.</p></div>`}</div>`;
  document.getElementById("app").innerHTML = html;
}

function websiteOverview(){
  const h = profileData("harshith"), s = profileData("shravan");
  document.getElementById("app").innerHTML = `<div class="section-title"><div><h2>📊 Website Overview</h2><p>Current website content and activity.</p></div><button onclick="adminDashboard()">← Back to Dashboard</button></div><div class="project-grid"><div class="panel"><h3>👦 Profiles</h3><p>Harshith: ${esc(h.name)}<br>Shravan: ${esc(s.name)}</p></div><div class="panel"><h3>📝 Posts</h3><p>${posts.length} post(s) currently loaded.</p></div><div class="panel"><h3>🔐 Admin</h3><p>${esc(currentUser?.email || "Not logged in")}</p></div></div>`;
}

function renderAuthArea() {
  const area = document.getElementById("authArea");

  if (!area) return;

  if (isAdmin()) {

    area.innerHTML = `
      <span class="auth-user">
        👤 ${esc(currentUser.email || "Admin")}
      </span>

      <button onclick="adminDashboard()">
        ⚙️ Admin Dashboard
      </button>

      <button onclick="logout()">
        Logout
      </button>
    `;

  } else {

    area.innerHTML = `
      <button onclick="showLogin()">
        🔐 Admin Login
      </button>
    `;

  }
}
function adminDashboard() {

  document.getElementById("app").innerHTML = `

    <div class="section-title">
      <div>
        <h2>⚙️ Admin Dashboard</h2>

        <p>
          Manage the Harshith & Shravan website.
        </p>
      </div>
    </div>

    <div class="project-grid">

      <div class="panel">
        <h3>📝 Manage Posts</h3>

        <p>
          View, edit, and delete published posts.
        </p>

        <button onclick="managePosts()">
          Manage Posts
        </button>
      </div>

      <div class="panel">
        <h3>👦 Manage Profiles</h3>

        <p>
          Update Harshith and Shravan's profiles.
        </p>

        <button onclick="manageProfiles()">
          Manage Profiles
        </button>
      </div>

      <div class="panel">
        <h3>📊 Website Overview</h3>

        <p>
          View website content and activity.
        </p>

        <button onclick="websiteOverview()">
          View Overview
        </button>
      </div>

    </div>

  `;
}

async function deletePost(postId) {

  if (!isAdmin()) {
    alert("Admin access required.");
    return;
  }

  const confirmed = confirm(
    "Are you sure you want to delete this post?\n\n" +
    "This action cannot be undone."
  );

  if (!confirmed) {
    return;
  }

  try {

    const { error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", postId);

    if (error) {
      throw error;
    }

    alert("Post deleted successfully.");

    await loadPosts();

    await managePosts();

  } catch (error) {

    console.error(
      "Error deleting post:",
      error
    );

    alert(
      "Could not delete post: " +
      databaseErrorText(error)
    );

  }
}

async function editPost(postId) {

  if (!isAdmin()) {
    alert("Admin access required.");
    return;
  }

  document.getElementById("app").innerHTML = `
    <div class="section-title">
      <div>
        <h2>✏️ Edit Post</h2>
        <p>Loading post...</p>
      </div>
    </div>
  `;

  try {

    const { data: post, error } =
      await supabaseClient
        .from("posts")
        .select(`
          id,
          title,
          content,
          status
        `)
        .eq("id", postId)
        .single();

    if (error) {
      throw error;
    }

    document.getElementById("app").innerHTML = `

      <div class="section-title">

        <div>
          <h2>✏️ Edit Post</h2>
          <p>Update the post details below.</p>
        </div>

        <button onclick="managePosts()">
          ← Back to Posts
        </button>

      </div>


      <div class="panel">

        <label>Title</label>

        <input
          id="editPostTitle"
          type="text"
          value="${esc(post.title || "")}"
          style="width:100%;margin:10px 0 20px"
        />


        <label>Content</label>

        <textarea
          id="editPostContent"
          style="
            width:100%;
            min-height:250px;
            margin:10px 0 20px
          "
        >${esc(post.content || "")}</textarea>


        <label>Status</label>

        <select
          id="editPostStatus"
          style="margin:10px 0 25px"
        >

          <option
            value="published"
            ${post.status === "published"
              ? "selected"
              : ""}
          >
            Published
          </option>

          <option
            value="draft"
            ${post.status === "draft"
              ? "selected"
              : ""}
          >
            Draft
          </option>

        </select>


        <br>


        <button
          class="primary"
          onclick="savePostChanges('${post.id}')"
        >
          💾 Save Changes
        </button>


        <button onclick="managePosts()">
          Cancel
        </button>

      </div>

    `;

  } catch (error) {

    console.error(
      "Error loading post:",
      error
    );

    document.getElementById("app").innerHTML = `

      <div class="panel">

        <h2>✏️ Edit Post</h2>

        <p style="color:#c0392b">

          Could not load post:
          ${esc(databaseErrorText(error))}

        </p>


        <button onclick="managePosts()">
          ← Back to Posts
        </button>

      </div>

    `;

  }

}

async function savePostChanges(postId) {

  if (!isAdmin()) {
    alert("Admin access required.");
    return;
  }


  const title =
    document
      .getElementById("editPostTitle")
      .value
      .trim();

async function savePostChanges(postId) {

  if (!isAdmin()) {
    alert("Admin access required.");
    return;
  }


  const title =
    document
      .getElementById("editPostTitle")
      .value
      .trim();


  const content =
    document
      .getElementById("editPostContent")
      .value
      .trim();


  const status =
    document
      .getElementById("editPostStatus")
      .value;


  const message =
    document.getElementById(
      "editPostMessage"
    );


  const button =
    document.getElementById(
      "savePostButton"
    );


  if (!title) {

    message.style.color = "#c0392b";

    message.textContent =
      "Please enter a title.";

    return;

  }


  if (!content) {

    message.style.color = "#c0392b";

    message.textContent =
      "Please enter post content.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Saving...";


  try {

    const { error } =
      await supabaseClient
        .from("posts")
        .update({

          title: title,

          content: content,

          status: status

        })
        .eq("id", postId);


    if (error) {
      throw error;
    }


    message.style.color =
      "#2e8b57";


    message.textContent =
      "Post updated successfully!";


    setTimeout(() => {

      managePosts();

    }, 700);


  } catch (error) {

    console.error(
      "Error updating post:",
      error
    );


    message.style.color =
      "#c0392b";


    message.textContent =
      "Could not update post: " +
      databaseErrorText(error);


    button.disabled = false;

    button.textContent =
      "💾 Save Changes";

  }

}

async function deletePost(postId) {

  if (!isAdmin()) {
    alert("Admin access required.");
    return;
  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this post?\n\n" +
      "This action cannot be undone."
    );


  if (!confirmed) {
    return;
  }


  try {

    const { error } =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id", postId);


    if (error) {
      throw error;
    }


    alert(
      "Post deleted successfully."
    );


    await loadPosts();


    managePosts();


  } catch (error) {

    console.error(
      "Error deleting post:",
      error
    );


    alert(
      "Could not delete post: " +
      databaseErrorText(error)
    );

  }

}



async function saveProfile(profileId) {
  if (!isAdmin()) { alert("Admin access required."); return; }
  const getValue = field => {
    const el = document.getElementById(`profile-${field}-${profileId}`);
    return el ? el.value.trim() : "";
  };
  const message = document.getElementById("profile-message-" + profileId);
  const name = getValue("name");
  const role = getValue("role");
  const ageValue = getValue("age");
  const age = ageValue === "" ? null : Number.parseInt(ageValue, 10);
  if (!name) { message.style.color="#c0392b"; message.textContent="Name cannot be empty."; return; }
  if (ageValue !== "" && !Number.isInteger(age)) { message.style.color="#c0392b"; message.textContent="Age must be a whole number."; return; }
  message.style.color="#64748b"; message.textContent="Saving...";
  try {
    const { error } = await supabaseClient.from("profiles").update({
      name,
      role,
      age,
      tagline: getValue("tagline"),
      description: getValue("description"),
      image_url: getValue("image"),
      interests: getValue("interests"),
      working_on: getValue("working")
    }).eq("id", profileId);
    if (error) throw error;
    await loadProfiles();
    message.style.color="#2e8b57";
    message.textContent="✓ Changes saved successfully!";
  } catch (error) {
    console.error("Error saving profile:", error);
    message.style.color="#c0392b";
    message.textContent="Could not save: " + databaseErrorText(error);
  }
}
